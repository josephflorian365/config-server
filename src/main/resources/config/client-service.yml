spring:
  data:
    mongodb:
      uri: ${MONGODB_CLIENT_URI:mongodb://localhost:27017/clientdb}
  application:
    name: client-service
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9093}

kafka:
  bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9093}
  schema-registry-url: ${SCHEMA_REGISTRY_URL:http://localhost:8083}

server:
  port: 8081

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_SERVER_URL:http://localhost:8761/eureka/}

logging:
  level:
    com.nttdata: DEBUG

topics:
  client-validation-request: client.validation.request
  client-validation-reply: client.validation.reply
