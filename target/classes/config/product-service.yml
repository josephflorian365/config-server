spring:
  data:
    mongodb:
      uri: ${MONGODB_PRODUCT_URI:mongodb://localhost:27017/productdb}
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
  application:
    name: product-service

kafka:
  bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9093}
  schema-registry-url: ${SCHEMA_REGISTRY_URL:http://localhost:8083}

server:
  port: 8082

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_SERVER_URL:http://localhost:8761/eureka/}

logging:
  level:
    com.nttdata: DEBUG

resilience4j:
  circuitbreaker:
    instances:
      clientService:
        slidingWindowSize: 10
        permittedNumberOfCallsInHalfOpenState: 3
        waitDurationInOpenState: 10s
        failureRateThreshold: 50
        slowCallRateThreshold: 50
        slowCallDurationThreshold: 2s
  timelimiter:
    instances:
      clientService:
        timeoutDuration: 2s

topics:
  client-validation-request: client.validation.request
  client-validation-reply: client.validation.reply
  product-events: product.events
